38  <pre id="out"><span id="error">content.txt nahi mili — HTML ke saath waale folder mein rakho.</span></pre>

40  <script>
41    async function load() {
42      try {
43        const res = await fetch('content.txt?_=' + Date.now());
44        if (!res.ok) throw new Error();
45        const text = await res.text();
46  
47        const lines = text.split('\n');
48        if (lines[lines.length - 1] === '') lines.pop();
49  
50        const pad = String(lines.length).length;
51  
52        document.getElementById('out').textContent = lines.map((line, i) => {
53          const num = String(i + 1).padStart(pad, ' ');
54          return num + '  ' + line;
55        }).join('\n');
56  
57      } catch(e) {}
58    }
59  
60    load();
61  </script>
